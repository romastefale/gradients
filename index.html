  <script>
    (function () {
      var dark = false;
      try { dark = sessionStorage.getItem("gradient-theme") === "dark"; } catch (e) {}
      var color = dark ? "#141416" : "#f4f3f1";
      var root = document.documentElement;
      root.dataset.theme = dark ? "dark" : "light";
      root.style.colorScheme = dark ? "dark" : "light";
      root.style.backgroundColor = color;
      document.write('<meta name="theme-color" content="' + color + '">');
    })();
  </script>

  <style>
    :root {
      --bar-bg: rgba(238, 240, 245, .72);
      --bar-text: #0a0b0d;
      --bar-sub: rgba(0, 0, 0, .6);
      --bar-edge: rgba(0, 0, 0, .1);
      --chip-bg: rgba(255, 255, 255, .66);
      --chip-border: rgba(0, 0, 0, .12);
      --bar-bg-solid: #eef0f5;
      --sel-bg: rgba(255, 255, 255, .9);
      --hover-bg: rgba(0, 0, 0, .05);
      --picker-bg: rgba(242, 243, 247, .9);
      --edge: #f4f3f1;
      color-scheme: light;
      --screen-inset: 12px;
      --hair-gap: 9px;
    }
    :root[data-theme="dark"] {
      --bar-bg: rgba(6, 6, 7, .72);
      --bar-text: #fff;
      --bar-sub: rgba(255, 255, 255, .6);
      --bar-edge: rgba(255, 255, 255, .1);
      --chip-bg: rgba(255, 255, 255, .05);
      --chip-border: rgba(255, 255, 255, .14);
      --bar-bg-solid: #060607;
      --sel-bg: rgba(255, 255, 255, .16);
      --hover-bg: rgba(255, 255, 255, .07);
      --picker-bg: rgba(22, 22, 26, .88);
      --edge: #141416;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    html { background: var(--edge); color: var(--bar-text); touch-action: none; -webkit-text-size-adjust: 100%; }
    body {
      position: fixed; inset: 0; width: 100%;
      min-height: 100dvh;
      background: var(--edge);
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    button { touch-action: manipulation; }
    .stage {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: calc(84px + env(safe-area-inset-top, 0px)) max(var(--screen-inset), env(safe-area-inset-right, 0px)) 20px max(var(--screen-inset), env(safe-area-inset-left, 0px));
    }
    .shot {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      width: min(100%, calc((100dvh - 176px) * var(--ratio)));
    }
    .plate {
      width: 100%; padding: var(--hair-gap); border-radius: 18px;
      box-shadow: inset 0 0 0 1px var(--bar-edge);
    }
    .frame {
      position: relative;
      width: 100%; aspect-ratio: var(--ratio); border-radius: 12px;
      overflow: hidden; background: var(--edge);
    }
    .frame canvas {
      position: absolute; display: block; max-width: none;
    }
    .meta {
      display: flex; align-items: center; gap: 6px;
      color: var(--bar-sub); font-size: 11px; font-weight: 500; line-height: 1;
    }
    .mini { position: relative; }
    .meta button {
      appearance: none; border: 0; margin: 0; background: transparent; color: inherit;
      font: inherit; height: 20px; padding: 0 7px; border-radius: 999px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .meta button[aria-expanded="true"], .mini-menu button:hover { background: var(--hover-bg); }
    .mini-menu[hidden] { display: none; }
    .mini-menu {
      position: absolute; z-index: 3; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%); display: flex; gap: 2px; padding: 3px;
      border-radius: 999px; background: var(--picker-bg);
      box-shadow: inset 0 0 0 1px var(--bar-edge);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    }
    .mini-menu button { height: 22px; padding: 0 8px; color: var(--bar-text); }
    .site-header {
      position: fixed; z-index: 70; left: 0; right: 0;
      top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex; justify-content: center; pointer-events: none;
      padding: 0 max(var(--screen-inset), env(safe-area-inset-right, 0px)) 0 max(var(--screen-inset), env(safe-area-inset-left, 0px));
    }
    .sh-anchor { position: relative; min-width: 0; max-width: min(100%, 1040px); pointer-events: auto; }
    .sh-bar {
      --pill-gap: 6px;
      display: flex; align-items: center; gap: var(--pill-gap);
      min-width: 0; max-width: 100%; height: 52px; padding: 0 var(--hair-gap); border-radius: 26px;
      background: var(--bar-bg); color: var(--bar-text);
      overflow: hidden;
      -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
      box-shadow: inset 0 0 0 1px var(--bar-edge);
    }
    .sh-nav {
      position: relative; flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: var(--pill-gap);
      margin: 0; padding: 0 2px;
      overflow: hidden;
    }
    .sh-nav button, .sh-picker button {
      appearance: none; border: 0; margin: 0; background: transparent; color: var(--bar-sub);
      font: 500 13.5px/1 inherit; cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .sh-nav button {
      flex: 1 1 0; min-width: 0; height: 34px; padding: 0 2px; border-radius: 17px;
      text-align: center;
    }
    .sh-nav button[aria-current="true"] {
      background: var(--sel-bg); color: var(--bar-text); font-weight: 600;
      border: 1px solid var(--chip-border);
    }
    .sh-nav button:not([aria-current="true"]):hover { background: var(--hover-bg); color: var(--bar-text); }
    .sh-actions { flex: 0 0 auto; display: flex; align-items: center; gap: var(--pill-gap); }
    .sh-pill {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; padding: 0; border-radius: 999px; box-sizing: border-box;
      border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--bar-text);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .sh-pill[aria-expanded="true"] { background: var(--bar-text); color: var(--bar-bg-solid); border-color: transparent; }
    .sh-pill:focus-visible, .sh-nav button:focus-visible, .sh-picker button:focus-visible {
      outline: none; box-shadow: inset 0 0 0 1.5px var(--bar-sub);
    }
    .sh-picker {
      position: absolute; z-index: 2; top: calc(100% + 8px); right: 0;
      min-width: 148px; padding: 6px; border-radius: 22px;
      background: var(--picker-bg); color: var(--bar-text);
      box-shadow: inset 0 0 0 1px var(--bar-edge);
      -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    }
    .sh-picker button {
      display: block; width: 100%; min-height: 44px; padding: 0 16px; border-radius: 16px;
      text-align: left; color: var(--bar-text); font-size: 15px;
    }
    .sh-picker button:hover { background: var(--hover-bg); }
    @media (max-width: 760px) {
      :root { --hair-gap: 8px; }
      .sh-anchor { flex: 1 1 auto; width: 100%; }
      .sh-bar { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="shot">
      <div class="plate"><div class="frame" id="frame"><canvas id="shot"></canvas></div></div>
      <div class="meta">
        <span id="caption"></span>
        <span class="mini">
          <button type="button" id="save2" aria-label="Download" aria-expanded="false" aria-controls="mini"></button>
          <div class="mini-menu" id="mini" hidden>
            <button type="button" data-kind="png">PNG</button>

  </main>
  <header class="site-header">
    <div class="sh-anchor">
      <div class="sh-bar">
        <nav class="sh-nav" id="aspects" aria-label="Aspect"></nav>
        <div class="sh-actions">
          <button class="sh-pill" id="theme" type="button" aria-label="Theme"></button>
          <button class="sh-pill" id="again" type="button" aria-label="New"></button>
          <button class="sh-pill" id="save" type="button" aria-label="Download" aria-expanded="false" aria-controls="menu"></button>
        </div>
      </div>
      <div class="sh-picker" id="menu" hidden>
        <button type="button" data-kind="png">PNG</button>
        <button type="button" data-kind="html">HTML</button>
        <button type="button" data-kind="css">CSS</button>
      </div>
    </div>
  </header>
  <script>
    const SIDE = 4096;
    const SOLID = { light: "#f4f3f1", dark: "#141416" };
    const ASPECTS = ["1:1", "16:9", "4:3", "3:2", "21:9"];

    function turned(label) {
      const [a, b] = label.split(":");
      return `${b}:${a}`;
    }
    const ICON = {
      sun: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      again: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg>',
      down: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>',
    };

    function stored(key) {
      try { return sessionStorage.getItem(key); } catch (e) { return null; }
    }
    function store(key, value) {
      try { sessionStorage.setItem(key, value); } catch (e) {}
    }
    function forget(key) {
      try { sessionStorage.removeItem(key); } catch (e) {}
    }
    const savedAspect = stored("gradient-aspect");
    const state = {
      light: stored("gradient-theme") !== "dark",
      aspect: savedAspect || "1:1",
      seed: Number(stored("gradient-seed")) || 0,
      blooms: [],
    };

    function rand32() {
      const next = new Uint32Array(1);
      crypto.getRandomValues(next);
      return next[0] || 1;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function colorOf(hue) {
      const s = (state.light ? 72 : 58) / 100;
      const l = (state.light ? 58 : 42) / 100;
      const span = s * Math.min(l, 1 - l);
      const channel = (n) => {
        const k = (n + hue / 30) % 12;
        return l - span * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      };
      return [channel(0), channel(8), channel(4)];
    }

    const WORK = 512;

    function compile(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return null;
      return shader;
    }

    function program(gl, vs, fs) {
      const vert = compile(gl, gl.VERTEX_SHADER, vs);
      const frag = compile(gl, gl.FRAGMENT_SHADER, fs);
      if (!vert || !frag) return null;
      const prog = gl.createProgram();
      gl.attachShader(prog, vert);
      gl.attachShader(prog, frag);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
      return prog;
    }

    function target(gl, width, height, floatTex) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if (floatTex) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, width, height, 0, gl.RGBA, gl.HALF_FLOAT, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) return null;
      return { tex, fb, width, height };
    }

    function renderSquare() {
      const shot = document.getElementById("shot");
      shot.width = SIDE;
      shot.height = SIDE;
      const gl = shot.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false, alpha: false });
      if (!gl) return false;
      gl.getExtension("EXT_color_buffer_float");
      const tri = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, tri);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const quad = gl.createBuffer();
      const pass = program(gl, `#version 300 es
        layout(location=0) in vec2 a;
        out vec2 vUv;
        void main() {
          vUv = a * 0.5 + 0.5;
          gl_Position = vec4(a, 0.0, 1.0);
        }`, `#version 300 es
        precision highp float;
        uniform sampler2D src;
        uniform vec2 texel;
        uniform float sigma;
        uniform float radius;
        in vec2 vUv;
        out vec4 frag;
        void main() {
          vec4 acc = vec4(0.0);
          float sum = 0.0;
          for (int i = -80; i <= 80; i++) {
            float o = float(i);
            if (abs(o) > radius) continue;
            float w = exp(-0.5 * o * o / (sigma * sigma));
            acc += texture(src, vUv + texel * o) * w;
            sum += w;
          }
          frag = acc / sum;
        }`);
      const linear = program(gl, `#version 300 es
        layout(location=0) in vec2 a;
        out vec2 vUv;
        void main() {
          vUv = a * 0.5 + 0.5;
          gl_Position = vec4(a, 0.0, 1.0);
        }`, `#version 300 es
        precision highp float;
        uniform sampler2D src;
        in vec2 vUv;
        out vec4 frag;
        vec3 toLinear(vec3 c) {
          return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
        }
        void main() {
          vec4 s = texture(src, vUv);
          vec3 straight = s.a > 0.00001 ? s.rgb / s.a : vec3(0.0);
          frag = vec4(toLinear(clamp(straight, 0.0, 1.0)) * s.a, s.a);
        }`);
      const finish = program(gl, `#version 300 es
        layout(location=0) in vec2 a;
        out vec2 vUv;
        void main() {
          vUv = a * 0.5 + 0.5;
          gl_Position = vec4(a, 0.0, 1.0);
        }`, `#version 300 es
        precision highp float;
        uniform sampler2D src;
        uniform vec2 inner;
        uniform vec2 span;
        uniform vec3 solid;
        uniform float bayer[16];
        in vec2 vUv;
        out vec4 frag;
        vec3 toSrgb(vec3 c) {
          return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
        }
        void main() {
          vec2 uv = inner + vUv * span;
          vec2 size = vec2(textureSize(src, 0));
          vec2 pos = uv * size - 0.5;
          vec2 frac = fract(pos);
          vec2 base = (floor(pos) + 0.5) / size;
          vec2 texel = 1.0 / size;
          vec4 s00 = texture(src, base);
          vec4 s10 = texture(src, base + vec2(texel.x, 0.0));
          vec4 s01 = texture(src, base + vec2(0.0, texel.y));
          vec4 s11 = texture(src, base + vec2(texel.x, texel.y));
          vec4 sampleColor = mix(mix(s00, s10, frac.x), mix(s01, s11, frac.x), frac.y);
          float cover = clamp(sampleColor.a, 0.0, 1.0);
          vec3 lin = cover > 0.00001 ? sampleColor.rgb / cover : vec3(0.0);
          vec3 color = toSrgb(clamp(lin, 0.0, 1.0)) * cover + solid * (1.0 - cover);
          ivec2 px = ivec2(gl_FragCoord.xy);
          float grain = bayer[((px.y & 3) * 4) + (px.x & 3)];
          color += ((grain + 0.5) / 16.0 - 0.5) / 255.0;
          frag = vec4(clamp(color, 0.0, 1.0), 1.0);
        }`);
      const ellipses = program(gl, `#version 300 es
        layout(location=0) in vec2 a;
        uniform vec2 center;
        uniform vec2 radius;
        out vec2 local;
        void main() {
          local = a;
          gl_Position = vec4(center + a * radius, 0.0, 1.0);
        }`, `#version 300 es
        precision highp float;
        uniform vec4 ink;
        in vec2 local;
        out vec4 frag;
        void main() {
          if (dot(local, local) > 1.0) discard;
          frag = vec4(ink.rgb * ink.a, ink.a);
        }`);
      if (!pass || !linear || !finish || !ellipses) return false;
      const scale = WORK / SIDE;
      const sigma = 200.0 * scale;
      const pad = Math.max(1, Math.ceil(sigma * 3.0));
      const n = WORK + pad * 2;
      const shapes = target(gl, n, n, false);
      const lin = target(gl, n, n, true);
      const horizontal = target(gl, n, n, true);
      const vertical = target(gl, n, n, true);
      if (!shapes || !lin || !horizontal || !vertical) return false;
      const alpha = state.light ? 0.85 : 0.75;
      gl.bindFramebuffer(gl.FRAMEBUFFER, shapes.fb);
      gl.viewport(0, 0, n, n);
      gl.disable(gl.BLEND);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(ellipses);
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      for (const bloom of state.blooms) {
        const color = colorOf(bloom.hue);
        const px = pad + bloom.x * scale;
        const py = pad + bloom.y * scale;
        const cx = ((px + 0.5) / n) * 2 - 1;
        const cy = 1 - ((py + 0.5) / n) * 2;
        const rx = (bloom.rx * scale / n) * 2;
        const ry = (bloom.ry * scale / n) * 2;
        gl.uniform2f(gl.getUniformLocation(ellipses, "center"), cx, cy);
        gl.uniform2f(gl.getUniformLocation(ellipses, "radius"), rx, ry);
        gl.uniform4f(gl.getUniformLocation(ellipses, "ink"), color[0], color[1], color[2], alpha);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      gl.disable(gl.BLEND);
      function blit(prog, from, onto) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, onto ? onto.fb : null);
        gl.viewport(0, 0, onto ? onto.width : SIDE, onto ? onto.height : SIDE);
        gl.useProgram(prog);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, from.tex);
        gl.uniform1i(gl.getUniformLocation(prog, "src"), 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, tri);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      blit(linear, shapes, lin);
      gl.useProgram(pass);
      gl.uniform1f(gl.getUniformLocation(pass, "sigma"), sigma);
      gl.uniform1f(gl.getUniformLocation(pass, "radius"), sigma * 3.0);
      gl.uniform2f(gl.getUniformLocation(pass, "texel"), 1 / n, 0);
      blit(pass, lin, horizontal);
      gl.uniform2f(gl.getUniformLocation(pass, "texel"), 0, 1 / n);
      blit(pass, horizontal, vertical);
      const solid = state.light ? [0xf4 / 255, 0xf3 / 255, 0xf1 / 255] : [0x14 / 255, 0x14 / 255, 0x16 / 255];
      gl.useProgram(finish);
      gl.uniform2f(gl.getUniformLocation(finish, "inner"), pad / n, pad / n);
      gl.uniform2f(gl.getUniformLocation(finish, "span"), WORK / n, WORK / n);
      gl.uniform3f(gl.getUniformLocation(finish, "solid"), solid[0], solid[1], solid[2]);
      gl.uniform1fv(gl.getUniformLocation(finish, "bayer"), new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]));
      blit(finish, vertical, null);
      return gl.getError() === gl.NO_ERROR;
    }

    function fresh() {
      const random = mulberry32(state.seed);
      const count = 6 + Math.floor(random() * 2);
      state.blooms = Array.from({ length: count }, () => ({
        hue: random() * 360,
        x: random() * SIDE,
        y: random() * SIDE,
        rx: 900 + random() * 1100,
        ry: 700 + random() * 900,
      }));
    }

    function frame() {
      const parts = state.aspect.split(":");
      const rw = Number(parts[0]) || 1;
      const rh = Number(parts[1]) || 1;
      if (rw >= rh) {
        const sh = Math.round(SIDE * rh / rw);
        return { sx: 0, sy: Math.round((SIDE - sh) / 2), sw: SIDE, sh };
      }
      const sw = Math.round(SIDE * rw / rh);
      return { sx: Math.round((SIDE - sw) / 2), sy: 0, sw, sh: SIDE };
    }

    function place() {
      const solid = SOLID[state.light ? "light" : "dark"];
      const root = document.documentElement;
      const view = frame();
      root.dataset.theme = state.light ? "light" : "dark";
      root.style.colorScheme = state.light ? "light" : "dark";
      root.style.backgroundColor = solid;
      document.body.style.backgroundColor = solid;
      root.style.setProperty("--edge", solid);
      root.style.setProperty("--ratio", String(view.sw / view.sh));
      document.getElementById("caption").textContent = `${state.aspect} · ${view.sw}×${view.sh}`;
      const shot = document.getElementById("shot");
      shot.style.width = `${SIDE / view.sw * 100}%`;
      shot.style.height = `${SIDE / view.sh * 100}%`;
      shot.style.left = `${-view.sx / view.sw * 100}%`;
      shot.style.top = `${-view.sy / view.sh * 100}%`;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", solid);
      document.getElementById("theme").innerHTML = state.light ? ICON.moon : ICON.sun;
      document.querySelectorAll("#aspects button").forEach((button) => {
        const label = button.dataset.aspect;
        const on = state.aspect === label || state.aspect === turned(label);
        button.setAttribute("aria-current", on ? "true" : "false");
        button.textContent = on ? state.aspect : label;
      });
    }
    function download(name, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function cropCanvas(longSide) {
      const view = frame();
      const shot = document.getElementById("shot");
      const src = shot.width / SIDE;
      const width = Math.max(1, Math.round(view.sw * longSide / Math.max(view.sw, view.sh)));
      const height = Math.max(1, Math.round(view.sh * longSide / Math.max(view.sw, view.sh)));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(shot, view.sx * src, view.sy * src, view.sw * src, view.sh * src, 0, 0, width, height);
      return canvas;
    }

    function pngFile() {
      const view = frame();
      return new Promise((resolve) => cropCanvas(Math.max(view.sw, view.sh)).toBlob((blob) => resolve(blob), "image/png"));
    }

    function pageFile() {
      return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient</title>
<style>
  html, body { margin: 0; height: 100%; }
  ${look()}
</style>
</head>
<body></body>
</html>
`;
    }

    function cssFile() {
      return `${look()}\n`;
    }

    function erf(x) {
      const sign = x < 0 ? -1 : 1;
      const a = Math.abs(x);
      const t = 1 / (1 + 0.3275911 * a);
      const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
      return sign * y;
    }

    function bloomLayer(bloom, view) {
      const color = colorOf(bloom.hue).map((channel) => Math.round(Math.min(1, Math.max(0, channel)) * 255));
      const opacity = state.light ? 0.85 : 0.75;
      const sigma = 200;
      const radius = (bloom.rx + bloom.ry) / 2;
      const outer = radius + sigma * 3;
      const stops = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const fade = i === 12 ? 0 : opacity * 0.5 * (1 - erf((t * outer - radius) / (sigma * Math.SQRT2)));
        stops.push(`rgba(${color[0]}, ${color[1]}, ${color[2]}, ${fade.toFixed(3)}) ${(t * 100).toFixed(1)}%`);
      }
      const width = (bloom.rx + sigma * 3) / view.sw * 100;
      const height = (bloom.ry + sigma * 3) / view.sh * 100;
      const x = (bloom.x - view.sx) / view.sw * 100;
      const y = (bloom.y - view.sy) / view.sh * 100;
      return `radial-gradient(ellipse ${width.toFixed(2)}% ${height.toFixed(2)}% at ${x.toFixed(2)}% ${y.toFixed(2)}%, ${stops.join(", ")})`;
    }

    function look() {
      const solid = SOLID[state.light ? "light" : "dark"];
      const view = frame();
      const ratio = view.sw / view.sh;
      const image = [...state.blooms].reverse().map((bloom) => bloomLayer(bloom, view)).join(",\n    ");
      return `html {
  background: ${solid};
  min-height: 100%;
}
html::before {
  content: "";
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(100vw, calc(100vh * ${ratio.toFixed(6)}));
  height: min(100vh, calc(100vw / ${ratio.toFixed(6)}));
  background-color: ${solid};
  background-image:
    ${image};
  background-repeat: no-repeat;
}`;
    }

    function closeMenu() {
      document.getElementById("menu").hidden = true;
      document.getElementById("mini").hidden = true;
      document.getElementById("save").setAttribute("aria-expanded", "false");
      document.getElementById("save2").setAttribute("aria-expanded", "false");
    }

    function toggleMenu(menuId, buttonId) {
      const menu = document.getElementById(menuId);
      const open = menu.hidden;
      closeMenu();
      if (!open) return;
      menu.hidden = false;
      document.getElementById(buttonId).setAttribute("aria-expanded", "true");
    }

    async function deliver(kind) {
      closeMenu();
      const buttons = [document.getElementById("save"), document.getElementById("save2")];
      buttons.forEach((button) => { button.disabled = true; });
      try {
        if (kind === "png") {
          const png = await pngFile();
          if (png) download("gradient.png", png);
        }
        if (kind === "html") download("gradient.html", new Blob([pageFile()], { type: "text/html" }));
        if (kind === "css") download("gradient.css", new Blob([cssFile()], { type: "text/css" }));
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    const aspects = document.getElementById("aspects");
    for (const label of ASPECTS) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.aspect = label;
      button.textContent = label;
      button.onclick = () => {
        const other = turned(label);
        state.aspect = state.aspect === label || state.aspect === other ? turned(state.aspect) : label;
        store("gradient-aspect", state.aspect);
        closeMenu();
        place();
      };
      aspects.append(button);
    }

    document.getElementById("theme").onclick = () => {
      store("gradient-theme", state.light ? "dark" : "light");
      store("gradient-seed", String(state.seed));
      store("gradient-aspect", state.aspect);
      location.reload();
    };
    document.getElementById("again").innerHTML = ICON.again;
    document.getElementById("save").innerHTML = ICON.down;
    document.getElementById("save2").innerHTML = ICON.down;
    document.getElementById("again").onclick = () => {
      forget("gradient-seed");
      forget("gradient-aspect");
      location.reload();
    };
    document.getElementById("save").onclick = () => toggleMenu("menu", "save");
    document.getElementById("save2").onclick = () => toggleMenu("mini", "save2");
    document.querySelectorAll("[data-kind]").forEach((button) => {
      button.onclick = () => deliver(button.dataset.kind);
    });
    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".sh-anchor, .mini")) closeMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeMenu();
    });
    document.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
    document.addEventListener("gesturechange", (event) => event.preventDefault(), { passive: false });
    document.addEventListener("touchmove", (event) => {
      if (event.touches.length > 1) event.preventDefault();
    }, { passive: false });

    if (!ASPECTS.some((name) => name === state.aspect || turned(name) === state.aspect)) state.aspect = "1:1";
    if (!state.seed) state.seed = rand32();
    store("gradient-theme", state.light ? "light" : "dark");
    store("gradient-seed", String(state.seed));
    store("gradient-aspect", state.aspect);
    fresh();
    renderSquare();
    place();
  </script>
</body>
</html>
